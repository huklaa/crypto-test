name = "chainling-x-verifier"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
SITE_ORIGIN = "https://chainling.xyz"
X_TARGET_USERNAME = "chainling_xyz"
X_CAMPAIGN_TWEET_ID = "REPLACE_AFTER_POSTING"
CHAIN_ID = "4663"
MINT_CONTRACT_ADDRESS = "REPLACE_AFTER_DEPLOYMENT"

# Configure these with `wrangler secret put` or the Cloudflare dashboard:
# X_CLIENT_ID
# X_CLIENT_SECRET
# SESSION_SECRET (at least 32 random bytes)
# MINT_SIGNER_PRIVATE_KEY (dedicated signer; never use the owner/Ledger key)
